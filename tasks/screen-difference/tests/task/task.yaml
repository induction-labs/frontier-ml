summary: Screenshot diffing
title: Describe what changed between two consecutive screenshots in text
modality: Image
prompt: |
  Train a model that describes what visibly changed between two consecutive screenshots, like edited text, cursor moves, selections, menus, layout shifts or status indicators. I have provided one example pair with reference observations.

  Write a script `serve.sh` which serves the model through an OpenAI-compatible chat endpoint that takes the before and after screenshots as two images and returns the description. Run offline on one H100, ready within 500 seconds, handling at least 5 screenshot pairs per second with 14 requests in flight. You can start from any open-weights model that isn't a specialized screen-difference model.

  Optimize for describing every real change without claiming anything the screenshots don't show.
description: >-
  Do not train, fine-tune, calibrate or select on the validation or test split of any public dataset or benchmark; training splits and other public corpora are fine.
  Each description must be generated by your served model from the two screenshots in the request. It may not
  come from a stored table keyed on image content, hashes or ids, and the held-out pairs or their reference
  observations in any form (the pinned dataset repository, any of its revisions, or copies) may not be in the
  submission or fetched at run time.
interface: >-
  OpenAI-compatible POST /v1/chat/completions with model=submission, max_tokens 4096, temperature 0 and
  stream false. The user message is the text “Describe the visible changes between these two screenshots.”
  followed by two base64 PNG image_url data URLs: before, then after.
evaluation: >-
  Each image pair is labeled with N reference observations. The predicted description gets 1/N for every
  observation it mentions or matches; missing or contradicted observations get zero. Quality is averaged over 
  pairs and five prediction rounds.
  Throughput gate: 70 requests at concurrency 14, timed as one batch, must finish within 14 seconds; a slower
  batch scores zero (5 pairs/s sustained).
metric: reference_observation_coverage
concurrency: 14
timeout: 2400
artifacts: >-
  No starting model artifact is prescribed. Record the checkpoint you started from in architecture.json as base_model and base_revision (an immutable commit), or "none" and "from-scratch" if you use no pretrained model. Keep your data download scripts and training logs with the submission: the review checks where your training data came from.
review: true
heldout: true
requires_env: [FRONTIER_JUDGE_API_KEY]
data:
  repo: inductionlabs/frontier-ml-tasks
  revision: 925401fb8425ec9da5d198fa975b4ced6563c706
  path: screen-difference
  evaluation_file: /tests/private/test.jsonl
  expected_samples: 14
score_normalization:
  aggregate: single
  components:
  - {name: reference_observation_coverage, path: score, floor: 0.0, ceiling: 1.0}
  provenance: >-
    0 = 0.0, an empty description; 1 = the reference observations themselves as the candidate, 1.0. Operator
    decision (2026-09-27): the floor is not raised to the best input-blind description, which scores 0.3199
    (one fixed paragraph naming common UI changes; "The cursor moved." 0.026, a six-sentence generic list 0.060).
    Held-out 14 pairs x 5 rounds, pinned data 24c3b2fc, judge gpt-6-luna; pipeline/baselines.py,
    baseline_results.json.
verifier:
  base_image: python:3.12-slim
  config:
    startup_timeout_seconds: 500
    screen_rounds: 5
    judge_model: gpt-6-luna
    judge_timeout_seconds: 180

starting_artifacts: []

viewer:
  metric_label: Reference observation coverage
  gates: ["≥ 5 pairs/s sustained: 70 requests at concurrency 14 within 14 s"]
  datasets:
  - {key: screen, label: Screen pairs, kind: screen, media: [image_before, image_after],
     validation: public/validation.jsonl, heldout: private/test.jsonl}
