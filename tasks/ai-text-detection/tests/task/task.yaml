title: Detect whether a passage was written by a person or generated by an AI model, to flag machine-written text
summary: AI-generated text detection
modality: Text
shipped_examples_free: true
prompt: |
  Train one local model to distinguish AI-generated from human-written passages. It needs to work for Arabic, Chinese, English, French, German, Portuguese, Russian and Spanish. I have provided 200 labeled example passages.

  Start from any general pretrained backbone, but not one already trained for AI-text detection.

  Write a script `serve.sh` which serves the AI-detector. It should have a `POST /detect` endpoint which takes a passage and returns the probability that the passage was written by an AI model. It should run offline on one H100, be ready within 300 seconds, and score at least 10 passages per second.

  Optimize AI-text recall at a 1% false-positive rate, averaged over languages, generators and conditions.
description: >-
  Do not train, fine-tune, calibrate or select on the validation or test split of any public dataset or benchmark; training splits and other public corpora are fine. However, you are free to use the validation data samples I have provided however you want.
interface: >-
  POST /detect with {"text": "..."}; return {"p_ai": <number in [0, 1]>}, higher meaning more likely AI-generated.
  Each request is independent: score only its text, without caching or comparing across requests.
evaluation: >-
  Your model is scored based on its AI-text recall at 1% FPR. A single threshold is chosen so that at most 1% of
  human passages score strictly above it; FNR is the fraction of AI passages at or below it.
  Throughput must reach 10 passages per second at 32 concurrent requests.
metric: macro_fnr_at_1pct_fpr
concurrency: 32
timeout: 1200
artifacts: >-
  Choose any open-weights checkpoint. Record its name as base_model and immutable revision as base_revision
  in architecture.json.
review: true
heldout: true
data:
  repo: inductionlabs/frontier-ml-tasks
  revision: 925401fb8425ec9da5d198fa975b4ced6563c706
  path: ai-text-detection
  evaluation_file: /tests/private/test.jsonl
  expected_samples: 78090
verifier:
  base_image: python:3.12-slim
  config:
    evaluation_samples: 5000
    verifier_lifetime_seconds: 3000

starting_artifacts: []

viewer:
  metric_label: 1 - macro FNR at 1% FPR
  gates: ["≥ 10 passages/s", "code review"]
  datasets:
  - {label: Development sample and held-out passages, title: text, category: domain, category_label: Domain, chips: [label, language, family, condition],
     texts: [text], validation: public/validation.jsonl,
     heldout: {path: private/test.jsonl, chips: [label, language, family, condition]}}
