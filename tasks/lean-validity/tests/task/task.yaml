summary: Lean proof world model
title: Predict Lean 4 proof validity without running Lean
modality: Text
shipped_examples_free: true
prompt: |
  Train a model that predicts whether a Lean 4 file compiles under Lean v4.15.0 and Mathlib v4.15.0, without running Lean. I have provided 526 labeled proof attempts.

  You can use Lean and Mathlib during development, but the submission can't include, run or reimplement them (no .olean files), and the answer has to come from the model, not hand-written rules. You can start from any open-weights model that isn't a specialized lean validity model.

  Write a script `serve.sh` which serves the model. It should have a `POST /check` endpoint which takes a Lean file and returns whether it compiles. It should run offline on one H100, be ready within 300 seconds, and answer about 6 files per second.

  Optimize macro F1 over compiling and non-compiling files.
description: >-
  Do not train, fine-tune, calibrate or select on the validation or test split of any public dataset or benchmark; training splits and other public corpora are fine. However, you are free to use the validation data samples I have provided however you want.
  About half of the provided validation statements are miniF2F-test problems, and that file is the only public validation- or test-split material you may train, calibrate or select on. Every other copy of miniF2F (test or valid, including public proof attempts on its statements) is off limits like any other public validation or test split. Reading such a split only to remove its statements from your training data is fine.
interface: >-
  POST /check with {"lean": "<complete Lean file>"}; return {"valid": true} or {"valid": false}.
  Each request is independent: answer from that file alone, without caching or comparing across requests.
evaluation: >-
  Scored by macro F1. The whole evaluation set has to be answered within 600 seconds, about 6 files per second
  at 64 concurrent requests.
metric: macro_f1
concurrency: 64
timeout: 3600
artifacts: >-
  Record the checkpoint you started from in architecture.json as base_model and base_revision (an immutable commit), or "none" and "from-scratch" if you use no pretrained model. Keep your data download scripts and training logs with the submission: the review checks where your training data came from.
review: true
heldout: true
data:
  repo: inductionlabs/frontier-ml-tasks
  revision: 925401fb8425ec9da5d198fa975b4ced6563c706
  path: lean-validity
  evaluation_file: /tests/private/test.jsonl
  expected_samples: 3540
inference:
  pip: [torch==2.8.0, transformers==4.57.1]
  index_url: https://download.pytorch.org/whl/cu128
score_normalization:
  aggregate: single
  components:
  - {name: macro_f1, path: score, floor: 0.5, ceiling: 1.0}
  provenance: >-
    0 = 0.5, a fair coin's macro F1 on the balanced compiles/does-not-compile labels (analytic); 1 = perfect.
    The reward is 2 * macro_f1 - 1 (2026-09-26).
verifier:
  base_image: python:3.12-slim
  config: {}

starting_artifacts: []

viewer:
  datasets:
  - {label: Lean proof attempts, title: theorem, category: valid, category_label: Compiles, chips: [kind, prover, error_category],
     texts: [lean, errors], validation: public/validation.jsonl, heldout: private/test.jsonl}
