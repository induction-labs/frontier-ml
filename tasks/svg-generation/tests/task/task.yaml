summary: SVG generation by finetuning gpt-oss-20b
title: Finetune gpt-oss-20b to draw SVGs
modality: Text
shipped_examples_free: true
prompt: |
  Finetune openai/gpt-oss-20b (in `/artifacts/gpt-oss-20b/`) into a model that turns a drawing instruction into a good SVG. I have provided 30 example instructions with reference SVGs.

  Submit only the finetuned weights, as an unquantized bf16 checkpoint in `/workspace/output/model/`. I serve them myself with SGLang on one H100, quantized to FP8 at load, with gpt-oss-20b's own chat template at reasoning effort low, and send each instruction at temperature 0.5 with up to 16,384 new tokens. The model has to write the SVG itself, and each SVG must fit in 32 KiB.

  Optimize how good the drawings are: a strict judge grades each rendering from 1 to 10 on fidelity to the instruction, detail, proportions, composition and aesthetics.
description: >-
  The submitted weights must descend from openai/gpt-oss-20b at the provided revision and from no other model's
  weights.
  Do not train, fine-tune, calibrate or select on the validation or test split of any public dataset or benchmark; training splits and other public corpora are fine. However, you are free to use the validation data samples I have provided however you want.
  Also don't train on any public text-to-SVG evaluation suite.
interface: >-
  I will serve model/ with SGLang 0.5.9 (the lmsysorg/sglang image at commit
  bbe9c7eeb520b0a67e92d133dfc137a3688dc7f2) on one H100, with --quantization fp8 --reasoning-parser gpt-oss --sampling-defaults openai 
  and a 20,480-token context, with gpt-oss-20b's own
  config.json, generation_config.json, tokenizer config and chat template. Only your safetensors shards, their index
  and tokenizer.json are read from model/. /task/public/serving/ holds the exact server script and files.
  Each request is POST /v1/chat/completions with model=submission and one user message, "Generate a self-contained
  SVG for this instruction. Return only the SVG." followed by a blank line and the instruction, with
  reasoning_effort=low, temperature=0.5, max_tokens=16384 and stream=false. Only choices[0].message.content is used
  and its outermost <svg ...>...</svg> must be at most 32,768 UTF-8 bytes, have
  a finite viewBox and use only the elements and attributes allowed in /task/public/SCHEMA.md.
evaluation: >-
  Each SVG is rendered at 512x512 and gpt-6-sol grades it against the instruction on six aspects from 1 to 10:
  fidelity, detail, proportions, composition, aesthetics and overall; a reference drawing is shown to it only to
  identify the subjects. An example scores (fidelity - 1)/9 times (the mean of the other five aspects - 1)/9, so a
  drawing that misses the instruction earns nothing for polish. The raw score is the mean over complexity groups,
  and the reward rescales it so that untouched gpt-oss-20b served this way scores 0 and the reference drawings score
  1, clamped to [0, 1]. The exact rubric is in /task/validate.py. An invalid SVG (including a missing or over-budget
  one) scores 0, and so does a request that fails after the shared retries, times out or answers in an undocumented
  shape: it stays in its complexity group at 0.
  All 254 held-out requests are sent at 8 in flight as one timed batch that must finish within 10,800 seconds,
  retries included; a slower batch scores zero. Answers are sampled, so grading the same weights twice can differ by
  about 0.01 in the raw score.
metric: macro_graded_drawing_quality
concurrency: 8
timeout: 10800
artifacts: >-
  openai/gpt-oss-20b at revision 6cee5e81ee83917806bbde320786a8fb61efebee is in /artifacts/gpt-oss-20b/; its experts
  are stored in MXFP4, so dequantize to bf16 before training. Check that model/ ends up with all 411 tensors: for
  example, transformers 5.x save_pretrained() after loading with Mxfp4Config(dequantize=True) silently drops the
  expert weights. Include training_manifest.json (format in /task/public/SCHEMA.md) and every file it lists.
submission_instructions: >-
  Put the finetuned checkpoint in /workspace/output/model/ as regular files: bf16 safetensors shards holding exactly
  gpt-oss-20b's 411 tensors in the unquantized layout (names, shapes and dtypes in /task/public/serving/tensors.json),
  model.safetensors.index.json mapping them, and tokenizer.json copied unchanged from /artifacts/gpt-oss-20b/. Other
  files in model/ are ignored. At least one tensor must differ from the base checkpoint. Do not submit a serve.sh:
  the verifier copies /workspace/output to /submission and starts its own server (/task/public/serving/serve.sh)
  offline on one H100 SXM 80GB, and GET /health must answer within 900 seconds. Also put training_manifest.json,
  architecture.json and your training code, configuration and logs in /workspace/output/.
  An answer that holds no SVG document (for example when the model spends all 16,384 tokens reasoning) or whose SVG
  exceeds 32,768 bytes is an invalid SVG: it gets no credit for that item, and grading goes on however many there are.
  A request that times out or still fails after two retries on the same payload also gets no credit for that item;
  more than one in twenty failing that way stops grading as a fault of the grading server.
review_instructions: >-
  Include architecture.json with base_model "openai/gpt-oss-20b", base_revision
  "6cee5e81ee83917806bbde320786a8fb61efebee" and training_evidence_files (paths relative to output/, including the
  training source and the code that wrote model/). Keep training logs with the submission as readable text or JSON.
  Name the source of every training, calibration and selection corpus (in architecture.json or a data manifest) and
  keep its download or generation commands and logs. I will check that the weights were finetuned from that
  checkpoint during your session, and the training-data provenance.
review: true
heldout: true
requires_env: [FRONTIER_JUDGE_API_KEY]
system_packages: [librsvg2-bin, fonts-dejavu-core]
data:
  repo: inductionlabs/frontier-ml-tasks
  revision: 925401fb8425ec9da5d198fa975b4ced6563c706
  path: svg-generation
  evaluation_file: /tests/private/test.jsonl
  expected_samples: 254
verifier:
  base_image: python:3.12-slim-bookworm
  selfcheck_module: svg_selfcheck.py
  config:
    judge_model: gpt-6-sol
    judge_timeout_seconds: 180
    startup_timeout_seconds: 900
    verifier_lifetime_seconds: 13500
    selfcheck_timeout_seconds: 1500
starting_artifacts:
- repo: openai/gpt-oss-20b
  revision: 6cee5e81ee83917806bbde320786a8fb61efebee
  to: gpt-oss-20b
  exclude: ["original/*", "metal/*"]
score_normalization:
  aggregate: single
  components:
  - {name: graded_quality, path: score, floor: 0.18848066150025083, ceiling: 0.7534808990333807}
  provenance: >-
    Measured 2026-10-05 with this scorer (svg-generation-v5-graded) on the 254 held-out items. Floor: untouched
    openai/gpt-oss-20b (bf16, dequantized from the pinned revision) through trusted_server/serve.sh (SGLang 0.5.9,
    FP8) at temperature 0.5, the mean of two runs (0.1955 and 0.1815; 228-230 valid SVGs; at temperature 0 it was
    0.1887). Ceiling: the reference SVGs themselves (reference shown as both images), which do not depend on sampling.
viewer:
  metric_label: Graded drawing quality
  baseline_status: Floor = untouched gpt-oss-20b at temperature 0.5 (raw 0.188), ceiling = references (raw 0.753)
  order: 24
  datasets:
  - label: Drawing instructions
    title: instruction
    category: stratum
    texts: [instruction, reference_svg]
    validation: public/validation.jsonl
    heldout:
      path: private/test.jsonl
      texts: [instruction]
