summary: Fast calibrated zero-shot classifier
title: Train a fast calibrated zero-shot text classifier
modality: Text
prompt: |
  Train a zero-shot text classifier that works with any set of label descriptions. I have provided 500 labeled examples for checking your server locally; do not train, calibrate or select on them.

  Don't use any split of BTZSC or its source datasets (listed in `/task/public/DATA_POLICY.md`). Start from any pretrained LLM or encoder, but not one fine-tuned on those datasets, and don't use models from open-source reproductions of TypeSafe's JEV.

  Write a script `serve.sh` which serves the classifier. It should have a `POST /classify` endpoint which takes a text and a list of label descriptions and returns a probability for each label. It should run offline on one H100, be ready within 300 seconds, and handle at least 50 documents per second.

  Optimize macro-F1 * (1 - ECE), averaged over datasets.
description: >-
  Do not train, fine-tune, calibrate or select on the validation or test split of any public dataset or benchmark; training splits and other public corpora are fine.
  The 500 examples in /task/public/validation.jsonl are rows of the DBpedia-14 test split and fall under this rule:
  use them only to check your server locally (`python /task/validate.py`); do not train, fine-tune, distill or
  calibrate on them, and do not pick models, prompts or hyperparameters by their score on them.
interface: >-
  POST /classify with {"text": "...", "labels": ["description A", "description B", ...]} (2 to 256 distinct labels);
  return exactly {"probabilities": [...]}, one probability per label in request order, summing to 1 within 1e-6.
  Each request is independent: use only its text, labels and your trained weights, with no dataset-specific logic
  and no caching (not even label embeddings) or adaptation across requests. Batching concurrent requests is fine.
evaluation: >-
  The score is macro-F1 * (1 - ECE) per dataset, averaged over datasets; ECE uses top-label confidence and
  15 equal-width bins. Throughput must reach 50 documents/second at 32 concurrent requests. A request that
  fails after the retries counts as a confidently wrong answer.
metric: mean_calibrated_macro_f1
concurrency: 32
timeout: 600
artifacts: >-
  Include training_manifest.json (format in /task/public/SCHEMA.md) and the training code, config, logs and
  trained weights it lists.
review: true
heldout: true
