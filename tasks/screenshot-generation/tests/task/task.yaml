summary: Synthetic screenshot generation
title: Generate realistic screenshots from text boxes and a description, to synthesize training data for computer-use agents
modality: Image
prompt: |
  Build a system that generates realistic 1280x720 computer screenshots. Each request has a description of the screen and a list of text lines with pixel boxes. Render every line exactly, inside its box, and don't add any other text. I have provided 25 example screenshots.

  Write a script `serve.sh` which serves the generator. It should have a `POST /v1/images/generations` endpoint which returns the screenshot as a PNG. Run offline on one H100, ready within 300 seconds, with p95 latency of at most 30 seconds per image and every request answered within 120 seconds. You can use any open-weights model that isn't a specialized screenshot generation model.

  Optimize OCR text accuracy and layout, plus gpt-6-luna's ratings of realism and faithfulness to the description.
description: >-
  Do not train, fine-tune, calibrate or select on the validation or test split of any public dataset or benchmark; training splits and other public corpora are fine.
  Each screenshot must be generated by your served system from the request's description and text boxes, with a
  trained model, a renderer or any combination. It may not be a stored screenshot or a composite of stored
  held-out screenshots, and the held-out pages or their reference images in any form (the pinned dataset
  repository, any of its revisions, or copies) may not be in the submission or fetched at run time.
interface: >-
  POST /v1/images/generations with {"description": "...", "texts": [{"text": "...", "bbox": [x1, y1, x2, y2]}],
  "size": "1280x720"}. Boxes are integer pixel coordinates, x2 and y2 exclusive, up to 400 per request. Return {"data": [{"b64_json": "<base64 PNG>"}]} with exactly one 1280x720 8-bit RGB PNG
  (no alpha, no palette). Requests are sent one at a time.
evaluation: >-
  Each image scores the mean of realism and quality, where quality is the geometric mean of OCR text
  accuracy, OCR layout F1 and faithfulness to the description. The score is the mean over 200 held-out images. An
  image scores zero, and the other images are scored normally, when its request still fails after the retries
  described under Submission, takes over 120 seconds (retries included) or returns an invalid image. The score is
  zero for the whole run if more than 1 request in 20 ends that way, p95 latency exceeds 30 seconds, or the 200
  requests take over 7,200 seconds in total. All times are measured by the grading client inside the serving
  sandbox, so the grading system's own transport overhead never counts. Metric details are in
  /task/public/SCHEMA.md.
metric: mean_accuracy_realism
concurrency: 1
timeout: 10800
artifacts: >-
  No starting model is provided. Record the checkpoint you started from in architecture.json as base_model and base_revision (an immutable commit), or "none" and "from-scratch" if you use no pretrained model. Keep your data download scripts and training logs with the submission: the review checks where your training data came from.
review: true
heldout: true
requires_env: [FRONTIER_JUDGE_API_KEY]
data:
  repo: inductionlabs/frontier-ml-tasks
  revision: 925401fb8425ec9da5d198fa975b4ced6563c706
  path: screenshot-generation
  evaluation_file: /tests/private/test.jsonl
  expected_samples: 500
score_normalization:
  aggregate: single
  components:
  - {name: accuracy_realism, path: score, floor: 0.5368476993604454, ceiling: 0.9543198679926737}
  provenance: >-
    0 = 0.5368, the organizer Compositor (pipeline/baselines/methods.py: each text line drawn into its box on a
    white page) on the verifier's 200-image subset (T 0.987, L 0.961, F 0.332, R 0.408); 1 = 0.9543, the real reference
    screenshots through the same pipeline (T 1.000, L 0.980, F 0.994, R 0.917). Metric mean_accuracy_realism (per image
    (geomean(T, L, F) + R) / 2), pinned data 0f67bc92, PP-OCRv5 via rapidocr, judge gpt-6-luna with JUDGE_PARAMS, one
    run each (2026-10-07, pipeline/baselines/score_dir.py; work/screenshot-hsolve-bench/score-{compositor,real}.json).
verifier:
  base_dockerfile: scorer/Dockerfile
  resources:
    cpus: 8
    memory_mb: 65536
    storage_mb: 204800
    gpus: 1
    gpu_types: [H100]
  config:
    evaluation_samples: 200
    verifier_lifetime_seconds: 9300
    inference_timeout_seconds: 7200
    request_timeout_seconds: 120
    scorer_models_dir: /opt/screenshot-scorer/models
    judge_model: gpt-6-luna
    judge_concurrency: 16
    selfcheck_timeout_seconds: 1200

inference:
  pip:
  - torch==2.10.0+cu128
  - diffusers==0.40.0
  - transformers==5.17.0
  - accelerate==1.15.0
  - peft==0.21.0
  - safetensors==0.8.0
  - huggingface-hub==1.32.0
  - tokenizers==0.23.2
  index_url: https://download.pytorch.org/whl/cu128

viewer:
  metric_label: "Mean of quality (geomean of OCR text, OCR layout, judged faithfulness) and judged realism"
  gates: ["p95 ≤ 30 s/image", "valid 1280x720 PNG"]
  datasets:
  - {label: Screenshots of computer screens, title: description, chips: [screen_type, size], images: [image], texts: [description, texts],
     validation: public/validation.jsonl, heldout: {path: private/test.jsonl, images: []}}
